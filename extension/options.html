<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><title>CipherRoute · 配置中心</title><body><header><div><h1>Cipher<span>Route</span></h1><small>独立配置，自由组合</small></div><span class="tag">Chrome / Edge · Manifest V3</span></header><main><p id="status" role="status">正在读取…</p><p id="error" class="error" role="alert"></p><div class="row"><label>导入 ZeroOmega 备份<input id="omegaFile" type="file" accept=".bak,.json,application/json"></label></div><p id="importStatus" role="status" style="white-space:pre-wrap"></p><div id="importActions" class="row" hidden><button id="confirmImport" type="button" class="primary">确认导入</button><button id="cancelImport" type="button">取消导入</button></div><nav class="row" aria-label="配置分类"><button data-kind="modes">组合模式</button><button data-kind="proxies">代理配置</button><button data-kind="tlsProfiles">TLS 配置</button></nav><div class="layout" style="margin-top:20px"><aside class="card"><h2 id="listTitle"></h2><div id="profiles" class="stack"></div><button id="add" style="margin-top:18px">＋ 新建</button></aside><section class="card"><form id="form"><h2 id="editorTitle"></h2><label for="name">名称</label><input id="name" required maxlength="80"><div id="editor"></div><div class="row"><button class="primary" type="submit">保存配置</button><button id="apply" type="button">保存并启用</button><button id="delete" type="button">删除</button></div></form></section></div></main><script type="module" src="options.js"></script></body></html>

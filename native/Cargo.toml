[package]
name = "cipher-route-host"
version = "0.1.0"
edition = "2021"
[dependencies]
capture-core = { path = "../../http-capture/crates/capture-core" }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
[patch.crates-io]
h2 = { path = "../../http-capture/vendor/h2" }
[profile.dev]
debug = 1
incremental = false

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }

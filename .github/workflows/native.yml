name: Native packages
on:
  workflow_dispatch:
  pull_request:
    paths: ['native/**', 'scripts/**', '.github/workflows/native.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cipher-route
    steps:
      - uses: actions/checkout@v4
        with:
          path: cipher-route
          persist-credentials: false
      - name: Read pinned core revision
        id: core
        shell: bash
        run: echo "revision=$(python -c 'import json;print(json.load(open("scripts/core-source.json"))["revision"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: godstealer/http-capture
          ref: ${{ steps.core.outputs.revision }}
          path: http-capture
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cipher-route/native
      - uses: actions/setup-go@v5
        with:
          go-version-file: http-capture/helpers/httpcloak/go.mod
          cache-dependency-path: http-capture/helpers/httpcloak/go.sum
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - name: Helper tests
        working-directory: http-capture/helpers/httpcloak
        run: go test -mod=readonly ./...
      - run: node scripts/package-native.mjs
      - name: Check Linux runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ldd dist/cipher-route-linux-x64/cipher-route-host | tee dist/ldd.txt
          if grep -E 'not found|libdbus|libssl|libcrypto' dist/ldd.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cipher-route-${{ matrix.label }}
          path: |
            cipher-route/dist/*.zip
            cipher-route/dist/*.tar.gz
            cipher-route/dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.label == 'windows-x64'
        with:
          name: cipher-route-extension
          path: cipher-route/dist/extension

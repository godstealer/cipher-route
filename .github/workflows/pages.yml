name: Deploy installation page
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh static download list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases?per_page=30" --jq '[.[] | select(.draft == false) | {tag_name, assets: [.assets[] | {name, browser_download_url}]}]' > /tmp/releases.json
          python3 - <<'PYCODE'
          import json, pathlib
          p=pathlib.Path('/tmp/releases.json')
          releases=json.loads(p.read_text())
          assert isinstance(releases,list) and releases, 'No published release found'
          pathlib.Path('site/releases.json').write_text(json.dumps(releases,indent=2)+'\n')
          PYCODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
